version: 2

# Tagging rules (read by both the access policy and OpenMetadata):
#   tags                       exactly one of: public, internal, confidential, restricted
#   meta.openmetadata.domain   the business domain; must exist in OpenMetadata
#   meta.owner                 the owning team

models:
  - name: stg_orders
    description: Orders with clean types.
    config:
      tags: [internal]
      meta:
        owner: sales-data
        openmetadata:
          domain: sales
    columns:
      - name: order_id
        description: Order identifier.
        data_tests: [unique, not_null]
      - name: customer_id
        description: Customer who placed the order.
      - name: ordered_at
        description: When the order was placed.
      - name: amount
        description: Order total.

  - name: stg_customers
    description: Customers with clean types. Holds personal data.
    config:
      tags: [confidential]
      meta:
        owner: sales-data
        openmetadata:
          domain: sales
    columns:
      - name: customer_id
        description: Customer identifier.
        data_tests: [unique, not_null]
      - name: full_name
        description: Customer's full name.
      - name: email
        description: Customer's email address, lower-cased.
      - name: country
        description: Country of residence.
