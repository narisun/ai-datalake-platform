version: 2

models:
  - name: dim_customer
    description: One row per customer. Name and email are personal data.
    config:
      tags: [internal]
      contract:
        enforced: true
      meta:
        owner: sales-data
        openmetadata:
          domain: sales
          glossary: ["Business.Customer"]
    columns:
      - name: customer_id
        description: Customer identifier.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: full_name
        description: Customer's full name.
        data_type: varchar
        config:
          tags: [confidential]
      - name: email
        description: Customer's email address.
        data_type: varchar
        config:
          tags: [confidential]
      - name: country
        description: Country of residence.
        data_type: varchar

  - name: fct_orders
    description: One row per order, with the customer's country. Revenue reporting starts here.
    config:
      tags: [internal]
      contract:
        enforced: true
      meta:
        owner: sales-data
        openmetadata:
          domain: sales
    columns:
      - name: order_id
        description: Order identifier.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: customer_id
        description: Customer who placed the order.
        data_type: varchar
      - name: country
        description: Customer's country at the time of reporting; null if the customer is unknown.
        data_type: varchar
      - name: ordered_at
        description: When the order was placed.
        data_type: timestamp(6)
      - name: amount
        description: Order total.
        data_type: decimal(18,2)

  - name: agg_daily_revenue
    description: Orders and revenue per day and customer country.
    config:
      tags: [internal]
      contract:
        enforced: true
      meta:
        owner: sales-data
        openmetadata:
          domain: sales
    columns:
      - name: order_date
        description: The day the orders were placed.
        data_type: date
        data_tests: [not_null]
      - name: country
        description: Customer country, or "unknown".
        data_type: varchar
      - name: orders
        description: Number of orders.
        data_type: bigint
      - name: revenue
        description: Total order value.
        data_type: decimal(18,2)
