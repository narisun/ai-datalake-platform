datalake:
  target: dev
  outputs:
    dev:
      type: trino
      method: none
      user: "{{ env_var('TRINO_USER', 'svc_pipeline') }}"
      host: "{{ env_var('TRINO_HOST', 'localhost') }}"
      port: "{{ env_var('TRINO_PORT', '8080') | int }}"
      http_scheme: "{{ env_var('TRINO_SCHEME', 'http') }}"
      database: "{{ env_var('TRINO_CATALOG', 'lake') }}"
      schema: analytics
      threads: 4
