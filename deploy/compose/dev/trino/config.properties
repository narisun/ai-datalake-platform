# The Trino image's single-node defaults, plus one setting.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
cache-manager.config-files=etc/cache-manager-memory.properties

# Sign-in. Passwords are only accepted over HTTPS, so HTTPS is switched on with a
# certificate made by the trino-auth-init service. Port 8080 stays for Trino's own
# internal traffic and is not published; it does not accept user sign-in.
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/trino.pem
http-server.authentication.type=PASSWORD
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

# A column a user may not see is left out of `select *` and of table listings,
# instead of failing the whole query.
hide-inaccessible-columns=true
