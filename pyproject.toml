[project]
name = "ai-datalake-platform"
version = "0.1.0"
description = "Metadata-driven data lake platform: ingest, transform, catalogue and explore, with agents and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
storage = ["obstore>=0.6"]
dbt = ["dbt-core>=1.10,<2", "dbt-trino>=1.9"]

[project.scripts]
dl = "datalake.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.8",
    "pyright>=1.1.389",
    "import-linter>=2.1",
    "types-pyyaml>=6.0",
    "ai-datalake-platform[storage,dbt]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datalake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "A", "PT", "ASYNC"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

# Architecture rules. Modules depend only on the ones below them.
[tool.importlinter]
root_package = "datalake"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modules depend downward only"
type = "layers"
layers = [
    "datalake.cli",
    "datalake.agent",
    "datalake.search",
    "datalake.transform | datalake.ingest | datalake.catalog | datalake.storage",
    "datalake.policy",
    "datalake.control",
    "datalake.core",
]

[[tool.importlinter.contracts]]
name = "Models, ports and pure logic use no vendor libraries"
type = "forbidden"
source_modules = [
    "datalake.core",
    "datalake.agent.model",
    "datalake.agent.ports",
    "datalake.catalog.ports",
    "datalake.control.model",
    "datalake.control.ports",
    "datalake.ingest.model",
    "datalake.ingest.ports",
    "datalake.policy.model",
    "datalake.policy.ports",
    "datalake.policy.service",
    "datalake.search.model",
    "datalake.search.ports",
    "datalake.search.retriever",
    "datalake.search.rrf",
    "datalake.storage.ports",
    "datalake.transform.model",
    "datalake.transform.ports",
]
forbidden_modules = ["pydantic", "pydantic_settings", "yaml", "obstore", "dbt", "psycopg", "dotenv"]

[tool.ruff.lint.per-file-ignores]
# Throwaway spike scripts that run inside third-party containers.
"deploy/**" = ["E501"]
# A `with pytest.raises` around a `with control.start` reads better kept separate.
"tests/**" = ["SIM117", "PT012"]
